<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Data Network</title>
<meta name="description" content="Agents buy licensed data atomically on Solana, verify receipts and fund missing knowledge.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233ddc97'/%3E%3Ctext x='16' y='21' font-family='system-ui' font-size='12' font-weight='800' text-anchor='middle' fill='%23062015'%3EADN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="head">
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">ADN</div>
    <div><div class="brand-name">Agent Data Network</div><div class="brand-sub">Licensed data for AI agents, settled on Solana</div></div>
  </div>
  <div class="stages" id="stages" aria-label="Story stages"></div>
  <div class="controls">
    <button class="btn primary" id="btnRun" type="button">Run agent task</button>
    <button class="btn" id="btnPause" type="button" disabled>Pause</button>
    <button class="btn" id="btnNext" type="button">Next step</button>
    <button class="btn ghost" id="btnReset" type="button">Start session</button>
    <button class="btn ghost" id="btnTour" type="button" title="Guided tour / Rehberli tur" aria-label="Guided tour">?<span class="tour-label"> Tour</span></button>
  </div>
</header>
<div class="badges" id="badges" aria-label="Runtime mode"></div>
</div>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main id="main">
    <section class="view" id="v-overview" aria-labelledby="h-overview"></section>
    <section class="view" id="v-control" hidden></section>
    <section class="view" id="v-agent" hidden></section>
    <section class="view" id="v-market" hidden></section>
    <section class="view" id="v-providers" hidden></section>
    <section class="view" id="v-bounties" hidden></section>
    <section class="view" id="v-tx" hidden></section>
    <section class="view" id="v-earnings" hidden></section>
    <section class="view" id="v-evidence" hidden></section>
    <section class="view" id="v-connect" hidden></section>
  </main>
</div>
<div class="statusbar" role="status" aria-live="polite">
  <span id="statusDot" class="badge"><span class="dot"></span><span id="statusText">Connecting…</span></span>
  <span class="msg" id="statusMsg"></span>
  <span class="caps faint" id="caps"></span>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
<script src="/tour.js"></script>
</body>
</html>
