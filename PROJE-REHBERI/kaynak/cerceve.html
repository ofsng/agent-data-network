<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="diyagram/stil.css">
<style>
.win { position: absolute; left: 230px; top: 150px; width: 1460px; border-radius: 18px; overflow: hidden; background: #0a0e13; border: 1px solid #2a3644; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(61,220,151,.08), 0 0 120px rgba(61,220,151,.07); }
.bar { height: 46px; background: #121a23; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-bottom: 1px solid #1f2b38; }
.bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
.url { margin-left: 22px; flex: 1; height: 28px; border-radius: 8px; background: #0b1118; border: 1px solid #1f2b38; color: #94a3b4; font-family: var(--mono); font-size: 15px; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.win img { display: block; width: 1460px; height: 912.5px; object-fit: cover; object-position: top; }
.cap { position: absolute; left: 96px; top: 48px; right: 96px; display: flex; justify-content: space-between; align-items: center; }
.cap h2 { font-size: 40px; font-weight: 900; letter-spacing: -.01em; }
.cap h2 span { color: var(--mint); font-family: var(--mono); font-weight: 400; font-size: 24px; margin-right: 18px; }
.cap p { font-size: 22px; color: var(--muted); max-width: 820px; text-align: right; }
.fade { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(transparent, #070b10); }
.phones { position: absolute; top: 150px; left: 0; right: 0; display: flex; justify-content: center; gap: 70px; }
.phone { width: 390px; height: 844px; border-radius: 52px; padding: 14px; background: #121a23; border: 1px solid #2c3a4a; box-shadow: 0 40px 100px rgba(0,0,0,.6); }
.phone img { width: 362px; height: 816px; border-radius: 40px; display: block; object-fit: cover; object-position: top; }
</style></head><body>
<div class="cap"><h2><span id="n"></span><b id="t"></b></h2><p id="c"></p></div>
<div id="slot"></div>
<div class="fade"></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("n").textContent = q.get("n") || "";
document.getElementById("t").textContent = q.get("title") || "";
document.getElementById("c").textContent = q.get("cap") || "";
const slot = document.getElementById("slot");
if (q.get("mobile")) {
  slot.innerHTML = '<div class="phones">' + ["overview", "market", "earnings"].map(v => `<div class="phone"><img src="ekran-ham/m-${v}.png"></div>`).join("") + "</div>";
} else {
  slot.innerHTML = `<div class="win"><div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="url">🔒 agent-data-network.vercel.app</div></div><img src="${q.get("img")}"></div>`;
}
</script></body></html>
